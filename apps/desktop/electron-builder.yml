appId: com.example.vuemultiplatform
productName: Vue Multiplatform
executableName: vue-multiplatform
artifactName: vue-multiplatform-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# build/icon.png (512x512) is used for every platform; electron-builder converts it.

win:
  target:
    - target: nsis # installer
      arch: [x64, arm64]
    - target: portable # single .exe, no install
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64]
  category: Utility
  syncDesktopName: true
  synopsis: Vue 3 app shared across PWA, Capacitor and Electron
  # Shown as the .deb maintainer; replace with your own name/email.
  maintainer: Your Name <you@example.com>

mac:
  target: dmg
